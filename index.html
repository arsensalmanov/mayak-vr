<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Маленький маяк VR</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500&family=Yeseva+One&display=swap">
<style>
/* Layout: one full-bleed 3D stage; a quiet chart-style caption top-left, one control bottom-left. Single committed look: the scene itself is the palette. */
:root {
  color-scheme: dark;
  --night: #070d1f;
  --ink: #eef2f7;
  --ink-soft: #a9b7cc;
  --lamp: #ffd98a;
  --panel: rgba(9, 17, 36, 0.55);
  --line: rgba(238, 242, 247, 0.22);
  --display: "Yeseva One", Georgia, "Times New Roman", serif;
  --body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html, body { height: 100%; }
body { background: var(--night); color: var(--ink); font-family: var(--body); overflow: hidden; }
#stage { position: relative; height: 100%; min-height: 320px; }
#stage canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#stage canvas:active { cursor: grabbing; }
.caption, .controls { position: absolute; left: 20px; right: 20px; pointer-events: none; }
.caption { top: 20px; display: flex; flex-direction: column; gap: 6px; text-shadow: 0 1px 12px rgba(0, 0, 0, 0.45); }
.caption h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(26px, 5vw, 40px); line-height: 1.05; text-wrap: balance; }
.caption .light { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--lamp); font-variant-numeric: tabular-nums; }
.controls { bottom: 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
.controls button {
  pointer-events: auto; font: 500 14px/1 var(--body); color: var(--ink);
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
  padding: 11px 18px; cursor: pointer; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.controls button:hover { border-color: var(--lamp); }
.controls button:focus-visible { outline: 2px solid var(--lamp); outline-offset: 3px; }
.hint { font-size: 13px; color: var(--ink-soft); text-shadow: 0 1px 10px rgba(0, 0, 0, 0.5); }
#fallback { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--ink-soft); }
html, body { margin: 0; }
.controls button:disabled { opacity: 0.55; cursor: default; }
.controls button.primary { border-color: var(--lamp); color: var(--lamp); }
</style>
</head>
<body>

<div id="stage">
  <div class="caption">
    <h1>Маленький маяк</h1>
    <div class="light">Пр 6с · огонь 17 м над морем</div>
  </div>
  <div class="controls">
    <button id="vr" class="primary" type="button" disabled>Проверяю VR…</button>
    <button id="daynight" type="button" aria-pressed="false">Включить день</button>
    <span class="hint">В VR: курок переносит на следующую точку обзора, боковая кнопка меняет день и ночь.</span>
  </div>
  <div id="fallback" hidden>Этот браузер не смог запустить 3D-графику (WebGL). Откройте страницу в другом браузере.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  var stage = document.getElementById('stage');
  var renderer;
  try {
    if (!window.THREE) throw new Error('no three');
    renderer = new THREE.WebGLRenderer({ antialias: true });
  } catch (e) {
    document.getElementById('fallback').hidden = false;
    return;
  }
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  stage.insertBefore(renderer.domElement, stage.firstChild);

  var scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x1b2a4a, 0.011);
  var camera = new THREE.PerspectiveCamera(42, 1, 0.1, 700);
  camera.position.set(27, 10, 33);
  var rig = new THREE.Group();
  rig.add(camera);
  scene.add(rig);
  renderer.xr.enabled = true;

  var C = function (hex) { return new THREE.Color(hex); };
  var pal = {
    top:  [C(0x040816), C(0x3b86cf)],
    hor:  [C(0x1b2a4a), C(0xcfe4ef)],
    sea:  [C(0x0d2a44), C(0x1f7391)],
    sun:  [C(0x9db4ff), C(0xfff1d2)],
    orb:  [C(0xf4ecd2), C(0xfffbe6)]
  };
  var mix = function (a, b, k) { return a + (b - a) * k; };

  /* Sky */
  var skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: pal.top[0].clone() }, hor: { value: pal.hor[0].clone() } },
    vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: 'uniform vec3 top; uniform vec3 hor; varying vec3 vP; void main(){ float h = max(normalize(vP).y, 0.0); gl_FragColor = vec4(mix(hor, top, pow(h, 0.55)), 1.0); }'
  });
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(400, 32, 16), skyMat));

  /* Stars */
  var starPos = [];
  for (var i = 0; i < 1400; i++) {
    var u = Math.random() * Math.PI * 2, v = Math.acos(Math.random() * 0.96 + 0.04);
    starPos.push(350 * Math.sin(v) * Math.cos(u), 350 * Math.cos(v), 350 * Math.sin(v) * Math.sin(u));
  }
  var starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
  var starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false, transparent: true, depthWrite: false, fog: false });
  scene.add(new THREE.Points(starGeo, starMat));

  /* Moon / sun and lights */
  var orbMat = new THREE.MeshBasicMaterial({ color: pal.orb[0].clone(), fog: false });
  var orb = new THREE.Mesh(new THREE.SphereGeometry(9, 24, 16), orbMat);
  orb.position.set(-110, 95, -170);
  scene.add(orb);
  var hemi = new THREE.HemisphereLight(0x8fa8d8, 0x1a1f2a, 0.4);
  scene.add(hemi);
  var sun = new THREE.DirectionalLight(pal.sun[0].clone(), 0.5);
  sun.position.copy(orb.position);
  scene.add(sun);

  /* Sea */
  var seaGeo = new THREE.PlaneGeometry(500, 500, 110, 110);
  seaGeo.rotateX(-Math.PI / 2);
  var seaMat = new THREE.MeshStandardMaterial({ color: pal.sea[0].clone(), roughness: 0.35, metalness: 0.25, flatShading: true });
  scene.add(new THREE.Mesh(seaGeo, seaMat));
  var seaP = seaGeo.attributes.position;
  function waves(t) {
    for (var i = 0; i < seaP.count; i++) {
      var x = seaP.getX(i), z = seaP.getZ(i);
      seaP.setY(i, Math.sin(x * 0.25 + t) * 0.22 + Math.sin(z * 0.31 + t * 1.3) * 0.18 + Math.sin((x + z) * 0.12 + t * 0.7) * 0.3);
    }
    seaP.needsUpdate = true;
  }

  /* Helpers */
  function jitter(g, a) {
    var p = g.attributes.position;
    for (var i = 0; i < p.count; i++) {
      var x = p.getX(i), y = p.getY(i), z = p.getZ(i);
      var s = x * 12.9898 + y * 78.233 + z * 37.719;
      var h = function (n) { var r = Math.sin(s + n) * 43758.5453; return r - Math.floor(r) - 0.5; };
      p.setXYZ(i, x + h(1) * a, y + h(2) * a, z + h(3) * a);
    }
    return g;
  }
  var std = function (color, o) { return new THREE.MeshStandardMaterial(Object.assign({ color: color, roughness: 0.85 }, o || {})); };
  function add(geo, mat, x, y, z, parent) {
    var m = new THREE.Mesh(geo, mat);
    m.position.set(x || 0, y || 0, z || 0);
    (parent || scene).add(m);
    return m;
  }

  /* Island and rocks */
  var rockMat = std(0x565b63, { flatShading: true });
  var grassMat = std(0x55683f, { flatShading: true });
  add(jitter(new THREE.CylinderGeometry(6.4, 9, 3.2, 11, 2), 0.7), rockMat, 0, -0.5, 0);
  add(jitter(new THREE.CylinderGeometry(5.4, 6.2, 0.5, 11, 1), 0.25), grassMat, 0, 1.05, 0);
  var rocks = [[8.5, 0.2, 2, 1.9], [-8, 0, -3.5, 2.3], [3, 0.1, -9, 1.6], [-5.5, -0.1, 8, 2], [10.5, -0.3, -5, 1.2], [-11, -0.3, 4, 1.1], [1, -0.2, 11.5, 1.3], [6, 0.9, -4.5, 1.3], [-3, 0.9, -5.2, 1.1]];
  rocks.forEach(function (r, i) {
    var m = add(jitter(new THREE.IcosahedronGeometry(r[3], 0), r[3] * 0.3), rockMat, r[0], r[1], r[2]);
    m.rotation.set(i, i * 2.1, i * 0.7);
    m.scale.y = 0.75;
  });

  /* Lighthouse */
  var white = std(0xf1ede4), red = std(0xb5302a), dark = std(0x23262d, { roughness: 0.6 });
  var stone = std(0x8d8a84, { flatShading: true });
  var winMat = new THREE.MeshStandardMaterial({ color: 0x2a2418, emissive: 0xffc463, emissiveIntensity: 1.3 });
  var tower = new THREE.Group();
  scene.add(tower);
  add(new THREE.CylinderGeometry(1.9, 2.15, 0.9, 10), stone, 0, 1.3, 0, tower);
  var TH = 14, NS = 6, D = TH - 8;
  var rAt = function (k) { return 1.5 - 0.5 * k; };
  for (var s = 0; s < NS; s++) {
    add(new THREE.CylinderGeometry(rAt((s + 1) / NS), rAt(s / NS), TH / NS, 28), s % 2 ? red : white, 0, 1.75 + (s + 0.5) * TH / NS, 0, tower);
  }
  var head = new THREE.Group();
  head.position.y = D;
  tower.add(head);
  add(new THREE.CylinderGeometry(1.5, 1.25, 0.22, 28), dark, 0, 9.86, 0, head);
  var rail = add(new THREE.TorusGeometry(1.42, 0.03, 6, 36), dark, 0, 10.42, 0, head);
  rail.rotation.x = Math.PI / 2;
  for (var p = 0; p < 12; p++) {
    var a = p / 12 * Math.PI * 2;
    add(new THREE.CylinderGeometry(0.025, 0.025, 0.46, 5), dark, Math.cos(a) * 1.42, 10.2, Math.sin(a) * 1.42, head);
  }
  add(new THREE.CylinderGeometry(0.85, 0.85, 0.12, 12), dark, 0, 10.02, 0, head);
  add(new THREE.CylinderGeometry(0.8, 0.8, 1.2, 12, 1, true),
    new THREE.MeshBasicMaterial({ color: 0xffe9a8, transparent: true, opacity: 0.5, side: THREE.DoubleSide, depthWrite: false }), 0, 10.68, 0, head);
  for (var q = 0; q < 6; q++) {
    var b = q / 6 * Math.PI * 2;
    add(new THREE.BoxGeometry(0.06, 1.2, 0.06), dark, Math.cos(b) * 0.8, 10.68, Math.sin(b) * 0.8, head);
  }
  add(new THREE.SphereGeometry(0.33, 16, 12), new THREE.MeshBasicMaterial({ color: 0xfff6d0 }), 0, 10.68, 0, head);
  add(new THREE.ConeGeometry(1.05, 1, 12), red, 0, 11.78, 0, head);
  add(new THREE.SphereGeometry(0.13, 10, 8), dark, 0, 12.34, 0, head);
  /* door and windows, facing the default camera */
  var face = Math.PI / 4.4;
  function onWall(geo, mat, y, r, ang) {
    var m = add(geo, mat, Math.sin(ang) * r, y, Math.cos(ang) * r, tower);
    m.rotation.y = ang;
    return m;
  }
  onWall(new THREE.BoxGeometry(0.7, 1.3, 0.16), dark, 2.4, 1.46, face);
  onWall(new THREE.BoxGeometry(0.36, 0.56, 0.14), winMat, 5.2, 1.4, face);
  onWall(new THREE.BoxGeometry(0.34, 0.52, 0.14), winMat, 9, 1.26, face);
  onWall(new THREE.BoxGeometry(0.32, 0.5, 0.14), winMat, 12.6, 1.13, face);
  onWall(new THREE.BoxGeometry(0.32, 0.5, 0.14), winMat, 7.2, 1.33, face + 2.2);
  onWall(new THREE.BoxGeometry(0.32, 0.5, 0.14), winMat, 11, 1.19, face - 2.3);

  /* Keeper's cottage */
  var house = new THREE.Group();
  house.position.set(-3.5, 1.2, 1.8);
  house.rotation.y = 0.5;
  scene.add(house);
  add(new THREE.BoxGeometry(2.3, 1.5, 1.8), white, 0, 0.75, 0, house);
  var roof = add(new THREE.ConeGeometry(1.85, 1, 4), red, 0, 2, 0, house);
  roof.rotation.y = Math.PI / 4; roof.scale.z = 0.85;
  add(new THREE.BoxGeometry(0.3, 0.7, 0.3), stone, 0.6, 2.1, 0, house);
  add(new THREE.BoxGeometry(0.45, 0.45, 0.1), winMat, -0.5, 0.85, 0.9, house);
  add(new THREE.BoxGeometry(0.45, 0.9, 0.1), dark, 0.5, 0.45, 0.9, house);

  /* Jetty: a place to stand out on the water */
  var wood = std(0x6b5137);
  add(new THREE.BoxGeometry(3, 0.16, 2.2), wood, 15, 1.02, 13);
  [[-1.3, -0.9], [1.3, -0.9], [-1.3, 0.9], [1.3, 0.9]].forEach(function (o) {
    add(new THREE.CylinderGeometry(0.1, 0.1, 3.4, 6), wood, 15 + o[0], -0.3, 13 + o[1]);
  });

  /* Light: lamp glow and two opposite beams. One turn in 12 s gives a flash every 6 s. */
  var lamp = new THREE.PointLight(0xffd98a, 1.3, 26, 2);
  lamp.position.set(0, 16.68, 0);
  scene.add(lamp);
  var beams = new THREE.Group();
  beams.position.set(0, 16.68, 0);
  scene.add(beams);
  var beamMat = new THREE.MeshBasicMaterial({ color: 0xffe6a6, transparent: true, opacity: 0.15, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false });
  var spots = [];
  [1, -1].forEach(function (dir) {
    var g = new THREE.ConeGeometry(4.2, 60, 32, 1, true);
    g.translate(0, -30, 0);
    g.rotateZ(dir * Math.PI / 2);
    beams.add(new THREE.Mesh(g, beamMat));
    var sp = new THREE.SpotLight(0xffe2a0, 2.4, 90, 0.2, 0.7, 1);
    sp.target.position.set(dir * 20, -8, 0);
    beams.add(sp); beams.add(sp.target);
    spots.push(sp);
  });
  beams.rotation.z = 0;

  /* Controls */
  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 8.2, 0);
  controls.enableDamping = true;
  controls.enablePan = false;
  controls.minDistance = 14;
  controls.maxDistance = 85;
  controls.maxPolarAngle = Math.PI / 2 - 0.04;
  controls.autoRotate = !reduced;
  controls.autoRotateSpeed = 0.45;
  controls.update();

  /* Day / night */
  var k = 0, kTarget = 0;
  var btn = document.getElementById('daynight');
  function toggleDay() {
    kTarget = kTarget ? 0 : 1;
    btn.setAttribute('aria-pressed', kTarget ? 'true' : 'false');
    btn.textContent = kTarget ? 'Включить ночь' : 'Включить день';
  }
  btn.addEventListener('click', toggleDay);
  function applyTime() {
    skyMat.uniforms.top.value.copy(pal.top[0]).lerp(pal.top[1], k);
    skyMat.uniforms.hor.value.copy(pal.hor[0]).lerp(pal.hor[1], k);
    scene.fog.color.copy(skyMat.uniforms.hor.value);
    scene.fog.density = mix(0.011, 0.006, k);
    seaMat.color.copy(pal.sea[0]).lerp(pal.sea[1], k);
    sun.color.copy(pal.sun[0]).lerp(pal.sun[1], k);
    sun.intensity = mix(0.5, 1.25, k);
    hemi.intensity = mix(0.4, 0.95, k);
    orbMat.color.copy(pal.orb[0]).lerp(pal.orb[1], k);
    starMat.opacity = 1 - k;
    beamMat.opacity = mix(0.15, 0.02, k);
    winMat.emissiveIntensity = mix(1.3, 0.05, k);
    lamp.intensity = mix(1.3, 0.2, k);
    spots.forEach(function (s) { s.intensity = mix(2.4, 0, k); });
  }

  function resize() {
    var w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h || renderer.xr.isPresenting) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = w < h ? 58 : 42;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  resize();

  var clock = new THREE.Clock();
  applyTime();
  function frame() {
    var dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
    if (k !== kTarget) {
      k += Math.sign(kTarget - k) * dt * 0.7;
      if (Math.abs(kTarget - k) < 0.01) k = kTarget;
      k = Math.max(0, Math.min(1, k));
      applyTime();
    }
    waves(reduced ? t * 0.35 : t);
    beams.rotation.y = -t * (Math.PI * 2 / 12);
    if (!renderer.xr.isPresenting) controls.update();
    renderer.render(scene, camera);
  }

  /* VR: the visitor stands in the scene. Rig scale below 1 makes the world feel larger. */
  var VR_SCALE = 0.7;
  var spots3 = [
    { pos: [3.1, 1.3, 3.6], look: [0, 0, 0] },            /* on the grass by the door */
    { pos: [15, 1.1, 13], look: [0, 0, 0] },              /* on the jetty, whole tower in view */
    { pos: [Math.sin(face) * 1.14, 15.98, Math.cos(face) * 1.14], look: [Math.sin(face) * 9, 0, Math.cos(face) * 9] } /* on the gallery, facing the sea */
  ];
  var spotIx = 0, saved = null;
  function standAt(i) {
    var v = spots3[i];
    rig.position.set(v.pos[0], v.pos[1], v.pos[2]);
    rig.rotation.set(0, Math.atan2(v.pos[0] - v.look[0], v.pos[2] - v.look[2]), 0);
    rig.scale.setScalar(VR_SCALE);
  }
  for (var c = 0; c < 2; c++) {
    var ctrl = renderer.xr.getController(c);
    ctrl.addEventListener('select', function () { spotIx = (spotIx + 1) % spots3.length; standAt(spotIx); });
    ctrl.addEventListener('squeeze', toggleDay);
    rig.add(ctrl);
  }
  var vrBtn = document.getElementById('vr'), session = null;
  renderer.xr.addEventListener('sessionstart', function () {
    saved = { p: camera.position.clone(), q: camera.quaternion.clone() };
    camera.position.set(0, 0, 0); camera.quaternion.set(0, 0, 0, 1);
    spotIx = 0; standAt(0);
    vrBtn.textContent = 'Выйти из VR';
  });
  renderer.xr.addEventListener('sessionend', function () {
    session = null;
    rig.position.set(0, 0, 0); rig.rotation.set(0, 0, 0); rig.scale.setScalar(1);
    if (saved) { camera.position.copy(saved.p); camera.quaternion.copy(saved.q); }
    vrBtn.textContent = 'Войти в VR';
    resize();
  });
  vrBtn.addEventListener('click', function () {
    if (session) { session.end(); return; }
    navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'bounded-floor'] })
      .then(function (s) { session = s; return renderer.xr.setSession(s); })
      .catch(function () { vrBtn.textContent = 'VR не запустился, попробуйте ещё раз'; });
  });
  if (navigator.xr && window.isSecureContext) {
    navigator.xr.isSessionSupported('immersive-vr').then(function (ok) {
      vrBtn.disabled = !ok;
      vrBtn.textContent = ok ? 'Войти в VR' : 'VR-шлем не найден';
    }).catch(function () { vrBtn.textContent = 'VR недоступен'; });
  } else {
    vrBtn.textContent = window.isSecureContext ? 'Браузер без поддержки VR' : 'Для VR нужен адрес https://';
  }

  renderer.setAnimationLoop(frame);
})();
</script>
</body>
</html>
